<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Investigative Journalism I | Yeasir Arafat</title>

    <meta
        name="description"
        content="Investigative Journalism I — News Package by Yeasir Arafat."
    >

    <meta name="author" content="Yeasir Arafat">

    <link rel="stylesheet" href="../style.css">

    <style>

        /* ================================
           PROJECT PAGE
        ================================= */

        .project-page {
            min-height: 100vh;

            padding: 140px 6% 80px;

            background:
                radial-gradient(
                    circle at 80% 20%,
                    rgba(33, 150, 243, 0.12),
                    transparent 35%
                ),
                #06111f;
        }


        .project-container {
            width: 100%;

            max-width: 1200px;

            margin: 0 auto;
        }


        /* ================================
           PROJECT NUMBER
        ================================= */

        .project-number {
            color: #90caf9;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 4px;

            margin-bottom: 18px;
        }


        /* ================================
           PROJECT TITLE
        ================================= */

        .project-title {
            color: #ffffff;

            font-size: clamp(45px, 7vw, 90px);

            line-height: 0.95;

            font-weight: 900;

            letter-spacing: -2px;

            margin-bottom: 18px;
        }


        /* ================================
           PROJECT SUBTITLE
        ================================= */

        .project-subtitle {
            color: #90caf9;

            font-size: 20px;

            letter-spacing: 2px;

            margin-bottom: 30px;
        }


        /* ================================
           BLUE LINE
        ================================= */

        .project-line {
            width: 90px;

            height: 3px;

            background: #2196f3;

            box-shadow:
                0 0 20px rgba(33, 150, 243, 0.7);

            margin-bottom: 40px;
        }


        /* ================================
           VIDEO PROJECT CARD
        ================================= */

        .project-card {
            display: block;

            position: relative;

            width: 100%;

            max-width: 850px;

            overflow: hidden;

            text-decoration: none;

            padding: 0;

            border:
                1px solid rgba(144, 202, 249, 0.18);

            border-radius: 18px;

            background:
                rgba(255, 255, 255, 0.035);

            backdrop-filter: blur(15px);

            transition:
                transform 0.4s ease,
                border-color 0.4s ease,
                box-shadow 0.4s ease;
        }


        .project-card:hover {

            transform:
                translateY(-8px)
                scale(1.01);

            border-color:
                rgba(144, 202, 249, 0.6);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35),
                0 0 35px rgba(33, 150, 243, 0.15);
        }


        /* ================================
           VIDEO PREVIEW
        ================================= */

        .video-preview {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #06111f,
                    #102a43
                );
        }


        .video-preview img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                transform 0.6s ease,
                filter 0.6s ease;
        }


        .project-card:hover .video-preview img {

            transform: scale(1.06);

            filter: brightness(0.72);
        }


        /* ================================
           VIDEO OVERLAY
        ================================= */

        .video-overlay {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(3, 13, 25, 0.18);

            transition:
                background 0.4s ease;
        }


        .project-card:hover .video-overlay {

            background:
                rgba(3, 13, 25, 0.38);
        }


        /* ================================
           PLAY BUTTON
        ================================= */

        .play-button {

            width: 74px;

            height: 74px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                rgba(33, 150, 243, 0.92);

            color: #ffffff;

            font-size: 28px;

            padding-left: 5px;

            box-shadow:
                0 0 30px rgba(33, 150, 243, 0.55);

            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }


        .project-card:hover .play-button {

            transform: scale(1.12);

            box-shadow:
                0 0 45px rgba(33, 150, 243, 0.8);
        }


        /* ================================
           PROJECT INFO
        ================================= */

        .project-info {

            padding: 30px 32px 34px;
        }


        .project-info h2 {

            color: #ffffff;

            font-size: 28px;

            margin-bottom: 12px;
        }


        .project-info p {

            color: #b6c9d8;

            font-size: 16px;

            line-height: 1.7;

            margin-bottom: 18px;
        }


        /* ================================
           WATCH LABEL
        ================================= */

        .watch-label {

            color: #90caf9;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 2px;
        }


        /* ================================
           BACK BUTTON
        ================================= */

        .back-button {

            display: inline-flex;

            align-items: center;

            margin-top: 30px;

            padding: 13px 22px;

            color: #90caf9;

            text-decoration: none;

            border:
                1px solid rgba(144, 202, 249, 0.4);

            background:
                rgba(255, 255, 255, 0.04);

            transition: 0.3s ease;
        }


        .back-button:hover {

            color: #ffffff;

            border-color: #90caf9;

            transform:
                translateY(-3px);

            box-shadow:
                0 0 25px rgba(33, 150, 243, 0.2);
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .project-page {

                padding:
                    110px 6% 60px;
            }


            .project-title {

                font-size: 48px;

                letter-spacing: -1px;
            }


            .project-info {

                padding:
                    25px 22px 28px;
            }


            .project-info h2 {

                font-size: 24px;
            }


            .play-button {

                width: 62px;

                height: 62px;

                font-size: 23px;
            }

        }

    </style>

</head>

</body>

</html>
