<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mobile Journalism | Yeasir Arafat</title>

    <meta
        name="description"
        content="Mobile Journalism — MOJO Project by Yeasir Arafat."
    >

    <link rel="stylesheet" href="../style.css">

    <style>

        .project-page {
            min-height: 100vh;
            padding: 150px 8% 80px;

            background:
                radial-gradient(
                    circle at 80% 20%,
                    rgba(33, 150, 243, 0.12),
                    transparent 35%
                ),
                #06111f;
        }

        .project-container {
            max-width: 1100px;
            margin: auto;
        }

        .project-number {
            color: #90caf9;
            font-size: 13px;
            letter-spacing: 4px;
            margin-bottom: 18px;
        }

        .project-title {
            font-size: clamp(45px, 7vw, 90px);
            line-height: 0.95;
            margin-bottom: 20px;
        }

        .project-subtitle {
            color: #90caf9;
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 35px;
        }

        .project-line {
            width: 90px;
            height: 3px;

            background: #2196f3;

            box-shadow:
                0 0 20px rgba(33, 150, 243, 0.7);

            margin-bottom: 40px;
        }

        .project-card {
            display: block;

            position: relative;

            overflow: hidden;

            text-decoration: none;

            padding: 0;

            border:
                1px solid rgba(144, 202, 249, 0.18);

            border-radius: 18px;

            background:
                rgba(255, 255, 255, 0.035);

            backdrop-filter: blur(15px);

            transition:
                transform 0.4s ease,
                border-color 0.4s ease,
                box-shadow 0.4s ease;
        }

        .project-card:hover {

            transform:
                translateY(-8px)
                scale(1.01);

            border-color:
                rgba(144, 202, 249, 0.6);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35),
                0 0 35px rgba(33, 150, 243, 0.15);
        }

        .video-preview {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #06111f,
                    #102a43
                );
        }

        .video-preview img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                transform 0.6s ease,
                filter 0.6s ease;
        }

        .project-card:hover .video-preview img {

            transform: scale(1.06);

            filter:
                brightness(0.72);
        }

        .video-overlay {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                rgba(3, 13, 25, 0.18);

            transition:
                background 0.4s ease;
        }

        .project-card:hover .video-overlay {

            background:
                rgba(3, 13, 25, 0.38);
        }

        .play-button {

            width: 74px;
            height: 74px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(33, 150, 243, 0.92);

            color: #ffffff;

            font-size: 28px;

            padding-left: 5px;

            box-shadow:
                0 0 30px rgba(33, 150, 243, 0.55);

            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }

        .project-card:hover .play-button {

            transform: scale(1.12);

            box-shadow:
                0 0 45px rgba(33, 150, 243, 0.8);
        }

        .project-info {

            padding: 30px 32px 34px;
        }

        .project-info h2 {

            color: #ffffff;

            font-size: 28px;

            margin-bottom: 12px;
        }

        .project-info p {

            color: #b6c9d8;

            font-size: 16px;

            line-height: 1.7;

            margin-bottom: 18px;
        }

        .watch-label {

            color: #90caf9;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 2px;
        }

        .back-button {

            display: inline-flex;

            margin-top: 30px;

            padding: 13px 22px;

            color: #ffffff;

            text-decoration: none;

            border:
                1px solid rgba(144, 202, 249, 0.4);

            background:
                rgba(255, 255, 255, 0.04);

            transition: 0.3s ease;
        }

        .back-button:hover {

            border-color: #90caf9;

            transform:
                translateY(-3px);

            box-shadow:
                0 0 25px rgba(33, 150, 243, 0.2);
        }

    </style>

</head>


<body>


    <header class="navbar">

        <div class="nav-container">

            <a
                href="../index.html"
                class="logo"
            >
                YEASIR<span>.</span>
            </a>


            <a
                href="../index.html"

                style="
                    color:#dbeeff;
                    text-decoration:none;
                    font-size:12px;
                    text-transform:uppercase;
                    letter-spacing:1px;
                "
            >
                ← Back to Home
            </a>

        </div>

    </header>


    <main class="project-page">

        <div class="project-container">


            <div class="project-number">
                PROJECT 10
            </div>


            <h1 class="project-title">
                Mobile<br>
                Journalism
            </h1>


            <div class="project-subtitle">
                MOJO Project
            </div>


            <div class="project-line"></div>


            <a
                class="project-card"
                href="https://youtu.be/qz0cITjP0ww"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="video-preview">

                    <img
                        src="https://img.youtube.com/vi/qz0cITjP0ww/maxresdefault.jpg"
                        alt="Mobile Journalism MOJO Project"
                    >

                    <div class="video-overlay">

                        <div class="play-button">
                            ▶
                        </div>

                    </div>

                </div>


                <div class="project-info">

                    <h2>
                        Mobile Journalism
                    </h2>


                    <p>
                        MOJO Project
                    </p>


                    <div class="watch-label">
                        ▶ Watch Video on YouTube
                    </div>

                </div>

            </a>


            <a
                href="../index.html"
                class="back-button"
            >
                ← Back to Projects
            </a>


        </div>

    </main>


</body>

</html>
